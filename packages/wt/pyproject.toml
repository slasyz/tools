[project]
name = "wt"
version = "0.1.0"
description = "Manage git worktrees in one shared directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13"]

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
